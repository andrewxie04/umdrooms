name: Daily Data Bake Scheduler

on:
  schedule:
    # Run daily at 09:00 UTC (5 AM EST / 4 AM EDT). The commit carries
    # [skip ci] so Netlify does not build twice — the scheduled-rebuild
    # function (netlify.toml, 10:00 UTC) triggers the deploy that actually
    # publishes this data, so it must stay AFTER this job.
    - cron: '0 9 * * *'
  workflow_dispatch:

# Required for the final `git push` — the default GITHUB_TOKEN is read-only
# on repos using the modern default, and the push would fail without this.
permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update classroom availability data
        run: |
          AVAIL_FORCE_REFRESH=1 node scripts/update-buildings-data.js

      - name: Bake campus 3D geometry
        run: |
          node rooms-redesign/scripts/fetch-campus-data.mjs

      - name: Commit & push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rooms-redesign/public/buildings_data.json rooms-redesign/public/buildings_metadata.json rooms-redesign/public/campus-data.json
          git diff-index --quiet HEAD || git commit -m "chore(data): automated daily data refresh [skip ci]"
          git push
